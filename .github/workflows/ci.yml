name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,hosting]"
      - name: Lint
        run: ruff check src tests
      - name: Test (offline, scripted model)
        run: pytest -m "not live"
      - name: Verify hosted dependencies and browser syntax
        run: |
          python -c "from strands.models.openai import OpenAIModel; import firebase_admin"
          node --check web/app.js
          bash -n deploy.sh
