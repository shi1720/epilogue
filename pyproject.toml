[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epilogue-agent"
version = "0.1.0"
description = "Epilogue — the agent that settles what's left behind. Autonomous after-loss administration built on Strands Agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Shivam Gupta", email = "shivam1720406@gmail.com" },
]
keywords = ["agents", "strands", "aws", "bedrock", "automation", "estate"]
dependencies = [
  "strands-agents>=1.55",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["strands-agents[anthropic]"]
gemini = ["strands-agents[gemini]"]
openai = ["strands-agents[openai]"]
ollama = ["strands-agents[ollama]"]
litellm = ["strands-agents[litellm]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]
agentcore = ["bedrock-agentcore"]

[project.scripts]
epilogue = "epilogue.cli:main"

[project.urls]
Homepage = "https://github.com/shi1720/epilogue"

[tool.hatch.build.targets.wheel]
packages = ["src/epilogue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: tests that require real model credentials (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
